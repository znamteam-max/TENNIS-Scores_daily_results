name: US Open research

on:
  push:
    paths:
      - 'scripts/uso_research_run.py'
      - 'api/uso_research.py'
      - '.github/workflows/uso-research.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Build US Open research dataset
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python scripts/uso_research_run.py
      - uses: actions/upload-artifact@v4
        with:
          name: uso-research-2026
          path: uso_research_2026.json
          retention-days: 3
